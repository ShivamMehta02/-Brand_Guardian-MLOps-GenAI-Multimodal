[project]
name = "complianceqapipeline"
version = "0.1.0"
description = "Brand Guardian AI - Local stack (Whisper + ChromaDB + Gemini)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",

    # --- LangChain Core ---
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langgraph>=1.0.5",
    "langsmith>=0.5.2",

    # --- Vector Store (Local) ---
    "chromadb>=0.4.0",

    # --- Embeddings (Local, no API key) ---
    "sentence-transformers>=2.2.0",

    # --- Video Processing (Local) ---
    "yt-dlp>=2025.1.12",
    "faster-whisper>=1.0.3",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",

    # --- Document Indexing ---
    "pypdf>=6.5.0",
    "requests>=2.32.5",
]
